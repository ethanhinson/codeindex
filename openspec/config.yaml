schema: spec-driven

context: |
  Project: codeindex — a Claude Code plugin that optimizes token usage when
  navigating a codebase. It indexes source into a symbol relationship graph
  (call graph + dependency graph) so Claude can answer "who calls X?" / "what
  depends on X?" with compact file:line + signature references instead of
  grepping and reading whole files.

  Architecture (bottom-up layers): language adapters (tree-sitter) → resolver
  (imports/scope → edges) → Merkle index (change detection) → symbol graph
  (SQLite) → query engine → CLI → MCP server → Claude plugin.

  Key decisions:
  - Implementation language: Go (single static binary, fast parallel parsing).
  - Parsing: tree-sitter per language; edges resolved by our own logic.
    Start name-based, later upgrade to import/scope-aware resolution.
  - Storage: SQLite (single .codeindex/graph.db file), transactional
    incremental updates, indexed both-direction edge traversal.
  - Merkle tree: incremental change detection only (NOT the relationship graph
    itself). Diff roots → re-parse only changed files → patch affected edges.
  - Freshness: on-demand `build` + lazy Merkle re-check on every query
    (no daemon). Always-correct answers with minimal per-query overhead.
  - Output contract: results are references (path:line + signature), never full
    source; --json for structured output; edges carry resolved_confidence so
    name-only matches are flagged.
  - Target languages: TypeScript/JS, Python, Go, PHP, .NET/C#.

  Roadmap decomposed into three OpenSpec changes:
  1. core-indexing-engine (this MVP): Merkle + SQLite graph + tree-sitter
     adapters for TypeScript/JS + Go + name-based resolver + all four query
     types (callers/callees, definition, dependencies, symbol search) via CLI,
     with on-demand build and lazy re-check.
  2. language-coverage-and-resolution: add Python, PHP, .NET/C# adapters and
     upgrade resolver to import/scope-aware precise edges.
  3. mcp-and-plugin: MCP server wrapper + Claude plugin (slash commands + a
     skill teaching Claude to query before grepping).

  Full design: docs/superpowers/specs/2026-07-08-codeindex-design.md

